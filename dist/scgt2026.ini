; scgt2026 renderer settings for Sports Car GT (see README.md for every option)
[scgt2026]
; output resolution, 0 = your monitor's
Width=0
Height=0
; 0 = exclusive fullscreen, 1 = window, 2 = borderless fullscreen
Window=2
; wider 3D view on wide screens (Hor+), HUD at the screen edges during races
Widescreen=1
HudToEdges=1
VSync=1
; texture filtering and anti-aliasing
Anisotropy=16
MSAA=4
Trilinear=1
; smooth scaling of movies and menus (0 = sharp pixels)
Filter2D=1
; load HD textures from the textures folder
ReplaceTextures=1
; developer options
DumpTextures=0
Trace=0
